<div class="page-shell">
  <app-hero-section
    *ngIf="currentUser"
    [currentUser]="currentUser"
    [booksTotal]="booksPage.totalElements"
    [feedTotal]="feedPage.totalElements"
    (profileOpen)="openProfile($event)"
    (logoutUser)="logout()"
  ></app-hero-section>

  <app-feedback-banner
    *ngIf="feedbackMessage"
    [message]="feedbackMessage"
    [kind]="feedbackKind"
  ></app-feedback-banner>

  <main *ngIf="!currentUser; else dashboardView" class="landing-layout">
    <app-auth-panel
      [authMode]="authMode"
      [authForm]="authForm"
      [authLoading]="authLoading"
      (authModeChange)="setAuthMode($event)"
      (submitForm)="submitAuth($event)"
    ></app-auth-panel>
  </main>

  <ng-template #dashboardView>
    <main *ngIf="activeView === 'dashboard'; else secondaryView" class="dashboard-layout">
      <app-feed-panel
        [feedPage]="feedPage"
        [currentUserId]="currentUser!.userId"
        [postContent]="postContent"
        [postSaving]="postSaving"
        [feedError]="feedError"
        [feedLoading]="feedLoading"
        [commentsByPost]="commentsByPost"
        [commentPagesByPost]="commentPagesByPost"
        [commentDrafts]="commentDrafts"
        [commentErrors]="commentErrors"
        [commentsLoading]="commentsLoading"
        [commentsOpen]="commentsOpen"
        (postContentChange)="postContent = $event"
        (submitPostForm)="submitPost($event)"
        (removePost)="deletePost($event)"
        (togglePostComments)="toggleComments($event)"
        (submitCommentForm)="submitComment($event.post, $event.form)"
        (commentDraftChange)="setCommentDraft($event.postId, $event.value)"
        (removeComment)="deleteComment($event.comment, $event.post)"
        (commentsPageChange)="loadComments($event.postId, $event.page)"
        (feedPageChange)="loadFeed($event)"
        (profileOpen)="openProfile($event)"
      ></app-feed-panel>

      <app-books-panel
        mode="shortcut"
        [bookStatusFilters]="bookStatusFilters"
        [bookStatusOptions]="bookStatusOptions"
        [statusLabels]="statusLabels"
        [selectedBookStatus]="selectedBookStatus"
        [bookForm]="bookForm"
        [booksPage]="booksPage"
        [booksError]="booksError"
        [booksLoading]="booksLoading"
        [bookSaving]="bookSaving"
        [editingBookId]="editingBookId"
        (selectedBookStatusChange)="selectedBookStatus = $event"
        (filterChange)="onBookFilterChange()"
        (submitForm)="submitBook($event)"
        (cancelEdit)="cancelBookEdit($event)"
        (editBook)="startBookEdit($event)"
        (removeBook)="deleteBook($event)"
        (pageChange)="loadBooks($event)"
        (libraryOpen)="showBooks()"
      ></app-books-panel>
    </main>

    <ng-template #secondaryView>
      <main class="content-page" *ngIf="activeView === 'books'; else profileView">
        <button type="button" class="back-button" (click)="showDashboard()">Voltar para inicio</button>

        <app-books-panel
          mode="library"
          [bookStatusFilters]="bookStatusFilters"
          [bookStatusOptions]="bookStatusOptions"
          [statusLabels]="statusLabels"
          [selectedBookStatus]="selectedBookStatus"
          [bookForm]="bookForm"
          [booksPage]="booksPage"
          [booksError]="booksError"
          [booksLoading]="booksLoading"
          [bookSaving]="bookSaving"
          [editingBookId]="editingBookId"
          (selectedBookStatusChange)="selectedBookStatus = $event"
          (filterChange)="onBookFilterChange()"
          (submitForm)="submitBook($event)"
          (cancelEdit)="cancelBookEdit($event)"
          (editBook)="startBookEdit($event)"
          (removeBook)="deleteBook($event)"
          (pageChange)="loadBooks($event)"
        ></app-books-panel>
      </main>

      <ng-template #profileView>
        <main class="content-page profile-page">
          <button type="button" class="back-button" (click)="showDashboard()">Voltar para inicio</button>

          <app-profile-panel
            [currentUserId]="currentUser?.userId ?? null"
            [profileError]="profileError"
            [profileLoading]="profileLoading"
            [selectedProfile]="selectedProfile"
            [profilePostsPage]="profilePostsPage"
            (postsPageChange)="loadProfilePosts($event)"
          ></app-profile-panel>
        </main>
      </ng-template>
    </ng-template>
  </ng-template>
</div>
